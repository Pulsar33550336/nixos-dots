max_length = 185
show_progress = true
title_scroll = "on_hover"

    [widget.media.actions]
    middle = "media toggle"
    right = "media next"
    scroll_down = "none"
    scroll_up = "none"

[widget.network]
show_label = false

[widget.ram]
interactive = false
show_value = false

[widget.recorder]
