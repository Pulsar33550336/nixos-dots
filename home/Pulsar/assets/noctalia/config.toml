[shell]
font_family = "Noto Sans CJK SC Medium"
corner_radius_scale = 1.2500000186264515
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_expand_all_groups = true
settings_window_translucent = true
telemetry_enabled = false

    [shell.animation]
    speed = 0.90000001341104507

    [shell.panel]
    control_center_placement = "floating"
    floating_layer = "top"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.session]
    grid = true

[system.monitor]
cpu_temp_activity_threshold = 75
cpu_temp_critical_threshold = 90
gpu_poll_seconds = 6
swap_pct_activity_threshold = 80
swap_pct_critical_threshold = 90

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
directory = "/home/Pulsar/Pictures"

    [wallpaper.default]
    path = "/home/Pulsar/Pictures/CS_ChapLoop04_Act0180_out_first.png"

[widget.Swap]
interactive = false
label_show_units = false
show_value = false
stat = "swap_pct"
type = "sysmon"

[widget.active_window]
icon_size = 18
max_length = 205
min_length = 0
title_scroll = "on_hover"

[widget.brightness]
show_label = false

    [widget.brightness.actions]
    scroll_down = "brightness-down 2"
    scroll_up = "brightness-up 2"

[widget.clock]
format = "{:%H:%M / %-m 月 %d 日 周%a}"
tooltip_format = "{:%H:%M 周%a - %Y 年 %-m 月 %d 日}"

[widget.cpu]
interactive = false
label_show_units = false
show_value = false

[widget.media]
