    "noctalia/screen_recorder",
    "pulsar/screen-shot-and-record"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    # TODO(P5): 换成 HM xdg.dataFile 投放的 local 源，去掉这个绝对路径
